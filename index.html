<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBE8EE">
<title>Сайти-навігатори</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Raleway:wght@400;500;600;700&family=Marck+Script&display=swap&subset=cyrillic" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#FBE8EE;--pink-light:#FFF5F7;--pink-deep:#E8B9C8;--brown:#70452F;--brown-light:#946344;--text:#59483F;--rose:#C78DA2}
html{min-height:100%;background:var(--pink)}
body{font-family:'Raleway',sans-serif;min-height:100vh;color:var(--text);background:
radial-gradient(ellipse 60% 52% at 8% 16%,rgba(244,196,211,.55),transparent 70%),
radial-gradient(ellipse 56% 58% at 92% 82%,rgba(255,216,226,.72),transparent 68%),var(--pink);
position:relative;overflow-x:hidden}
.page{position:relative;z-index:2;max-width:850px;margin:0 auto;padding:32px 18px 48px}
.header{text-align:center;margin-bottom:24px}
.brand-icon{width:62px;height:54px;display:block;margin:0 auto 8px}
.header h1{font-family:'Marck Script',cursive;font-weight:400;font-size:clamp(2.8rem,7vw,4.15rem);line-height:1.12;margin-bottom:12px;color:var(--brown);text-shadow:0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(112,69,47,.15)}
.header-desc{max-width:690px;margin:0 auto 20px;font-size:1.03rem;line-height:1.7;color:#74594D;font-weight:500}
.section-intro{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.65rem;color:var(--brown);margin:0 auto 10px;line-height:1.3}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(112,69,47,.36),transparent)}
.divider-dot{width:8px;height:8px;border-radius:50%;background:#B98770;box-shadow:0 0 9px rgba(112,69,47,.28)}
.links-list{display:flex;flex-direction:column;background:rgba(255,255,255,.44);border:1px solid rgba(112,69,47,.15);border-radius:22px;padding:7px 20px;box-shadow:0 14px 36px rgba(135,84,100,.10);backdrop-filter:blur(4px)}
.link-card{display:flex;align-items:center;gap:14px;padding:18px 7px;text-decoration:none;color:inherit;border-bottom:1px solid rgba(112,69,47,.17);transition:padding-left .22s ease,background .22s ease,transform .22s ease;border-radius:10px}
.link-card:last-child{border-bottom:none}
.link-card:hover{padding-left:15px;background:rgba(255,255,255,.58);transform:translateY(-1px)}
.link-symbol{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#FFF7F9,#F3D4DE);border:1px solid rgba(112,69,47,.12);color:var(--brown);box-shadow:0 7px 16px rgba(112,69,47,.11),inset 0 1px 0 rgba(255,255,255,.85)}
.link-symbol svg{width:25px;height:25px}
.link-body{flex:1;min-width:0}
.link-name{font-family:'Marck Script',cursive;font-size:clamp(1.65rem,4vw,2.05rem);line-height:1.25;color:var(--brown);display:block;transition:color .2s}
.link-card:hover .link-name{color:var(--brown-light)}
.link-arrow{font-size:1.45rem;color:#B98770;flex-shrink:0;transition:transform .2s,color .2s}
.link-card:hover .link-arrow{transform:translateX(4px);color:var(--brown)}
/* Великі напівпрозорі скляні фігури: повільно парять угору без обертання */
.floating-shapes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.shape{position:absolute;bottom:-190px;display:block;opacity:0;width:clamp(186px,21vw,336px);height:clamp(186px,21vw,336px);will-change:transform,opacity;animation:float-shape var(--duration,32s) ease-in-out var(--delay,0s) infinite;filter:drop-shadow(0 12px 16px rgba(146,91,111,.13))}
.shape::before{content:"";position:absolute;inset:8% 12% 12% 8%;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.06) 42%,rgba(161,98,126,.16));pointer-events:none}
.shape::after{content:"";position:absolute;top:12%;left:17%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.42);filter:blur(5px);transform:rotate(-28deg)}
.shape.quad{border:1px solid rgba(164,104,128,.42);border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.63),rgba(225,161,185,.43) 48%,rgba(180,117,147,.32));box-shadow:inset 8px 8px 16px rgba(255,255,255,.38),inset -9px -10px 18px rgba(148,87,116,.15)}
.shape.trapezoid{width:clamp(228px,25.5vw,408px);height:clamp(180px,19.5vw,306px);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(221,155,181,.55) 52%,rgba(165,105,136,.38));box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.shape.circle{border-radius:50%;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.88),rgba(255,255,255,.28) 19%,rgba(231,173,195,.62) 48%,rgba(175,111,143,.42) 78%,rgba(255,255,255,.32));border:1px solid rgba(255,255,255,.7);box-shadow:inset -10px -12px 20px rgba(136,79,108,.15),inset 7px 8px 18px rgba(255,255,255,.55)}
.shape.quad.tone-lilac{background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(198,183,225,.5),rgba(143,124,183,.3))}
.shape.circle.tone-peach{background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.9),rgba(255,226,207,.72) 40%,rgba(207,145,126,.42) 82%)}
.shape.trapezoid.tone-rose{background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(234,169,191,.58) 52%,rgba(181,103,139,.38))}
@keyframes float-shape{
  0%{transform:translate3d(0,0,0) scale(.92);opacity:0}
  8%{opacity:.48}
  28%{transform:translate3d(calc(var(--drift,24px)*.32),-30vh,0) scale(1);opacity:.44}
  52%{transform:translate3d(var(--drift,24px),-62vh,0) scale(.98);opacity:.40}
  76%{transform:translate3d(calc(var(--drift,24px)*.45),-92vh,0) scale(.94);opacity:.32}
  92%{opacity:.18}
  100%{transform:translate3d(calc(var(--drift,24px)*-.25),-125vh,0) scale(.9);opacity:0}
}
/* Прозорі плашки з назвами — без зміни переходів за посиланнями */
.links-list{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
.link-card{background:transparent}
.link-card:hover{background:rgba(255,255,255,.22)}
.link-symbol{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(243,212,222,.92));border:1px solid rgba(112,69,47,.16);color:var(--brown);box-shadow:0 7px 18px rgba(112,69,47,.11),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.link-symbol svg{width:26px;height:26px;stroke-linecap:round;stroke-linejoin:round}
.link-card:hover .link-symbol{transform:translateY(-2px) scale(1.05);background:linear-gradient(145deg,#fff,#F0C9D6);box-shadow:0 9px 20px rgba(112,69,47,.16)}
@media(max-width:600px){.page{padding:24px 13px 36px}.header-desc{font-size:.98rem}.links-list{padding:5px 12px}.link-card{padding:15px 3px;gap:10px}.link-symbol{width:36px;height:36px;flex-basis:36px}.link-name{font-size:1.55rem}.shape{transform-origin:center;opacity:.4}.shape.quad{width:162px;height:162px}.shape.trapezoid{width:192px;height:150px}.shape.circle{width:156px;height:156px}}
@media(prefers-reduced-motion:reduce){.shape{animation:none;display:none}.link-card,.link-arrow,.link-name{transition:none}}
</style>
</head>
<body>

  <span class="shape circle" style="left:17%;width:clamp(144px,15vw,234px);height:clamp(144px,15vw,234px);--duration:37s;--delay:-5s;--drift:24px"></span>
